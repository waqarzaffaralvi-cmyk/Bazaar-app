<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waqar Social & Messenger</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --wa-teal: #075E54;
            --wa-green: #25D366;
            --wa-light-green: #DCF8C6;
            --wa-bg: #ECE5DD;
            --wa-dark: #303030;
            --wa-gray: #f0f2f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--wa-bg); color: var(--wa-dark); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Header */
        header { background-color: var(--wa-teal); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .app-title { font-size: 20px; font-weight: bold; }
        .header-icons span { margin-left: 15px; cursor: pointer; font-size: 18px; }

        /* Stories / Following Top Bar */
        .top-stories { background: white; padding: 10px; display: flex; overflow-x: auto; gap: 12px; border-bottom: 1px solid #ddd; white-space: nowrap; }
        .story-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 60px; }
        .story-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--wa-green); padding: 2px; object-fit: cover; }
        .story-name { font-size: 11px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; width: 60px; text-align: center; }

        /* Main Container Layout (Messenger Style) */
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar Chat List */
        .sidebar { width: 350px; background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; height: 100%; }
        .search-box { padding: 10px; background: #f6f6f6; border-bottom: 1px solid #eee; }
        .search-box input { width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; background: white; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-list-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
        .chat-list-item:hover { background: var(--wa-gray); }
        .chat-list-avatar { width: 48px; height: 48px; border-radius: 50%; margin-left: 12px; object-fit: cover; }
        .chat-list-info { flex: 1; overflow: hidden; }
        .chat-list-name { font-weight: bold; font-size: 15px; color: #000; }
        .chat-list-msg { font-size: 13px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
        .chat-list-msg.unread { font-weight: bold; color: #000; }
        .unread-badge { background: var(--wa-green); color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold; min-width: 20px; text-align: center; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--wa-bg); height: 100%; }
        .chat-header { background: #f0f2f5; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; }
        .chat-header-profile { display: flex; align-items: center; gap: 12px; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .chat-header-name { font-weight: bold; font-size: 16px; }
        .call-buttons { display: flex; gap: 15px; font-size: 20px; color: var(--wa-teal); cursor: pointer; }

        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message-bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; word-wrap: break-word; }
        .message-bubble.incoming { background: white; align-self: flex-start; border-top-right-radius: 0; }
        .message-bubble.outgoing { background: var(--wa-light-green); align-self: flex-end; border-top-left-radius: 0; }
        .msg-time { font-size: 10px; color: #999; margin-top: 4px; text-align: left; }

        /* Chat Input Bar */
        .chat-input-bar { background: #f0f2f5; padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; }
        .chat-input-bar textarea { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #ccc; outline: none; resize: none; max-height: 100px; font-size: 14px; background: white; }
        .send-btn { background: var(--wa-teal); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        /* Bottom Navigation Bar */
        .bottom-nav { background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 8px 0; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; font-size: 12px; cursor: pointer; text-decoration: none; position: relative; flex: 1; }
        .nav-item.active { color: var(--wa-teal); font-weight: bold; }
        .nav-item span.icon { font-size: 20px; margin-bottom: 2px; }
        .nav-badge { position: absolute; top: 0; right: 30%; background: var(--wa-green); color: white; border-radius: 50%; padding: 1px 5px; font-size: 10px; font-weight: bold; }

        /* Hidden utility class */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="app-title">Waqar Messenger</div>
        <div class="header-icons">
            <span>📷</span>
            <span>🔍</span>
            <span>⋮</span>
        </div>
    </header>

    <!-- Top Stories / Following Bar -->
    <div class="top-stories" id="topStoriesBar">
        <!-- Dynamically populated followed members -->
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar Chat List -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="searchMembers" placeholder="فالو شدہ ممبرز تلاش کریں...">
            </div>
            <div class="chat-list" id="chatListContainer">
                <!-- Chat items loaded here -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatAreaSection">
            <div class="chat-header">
                <div class="chat-header-profile">
                    <img src="https://via.placeholder.com/40" class="chat-header-avatar" id="activeChatAvatar">
                    <div class="chat-header-name" id="activeChatName">چیٹ منتخب کریں</div>
                </div>
                <div class="call-buttons">
                    <span onclick="startAudioCall()" title="آڈیو کال">📞</span>
                    <span onclick="startVideoCall()" title="ویڈیو کال">📹</span>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <!-- Messages load here -->
            </div>

            <div class="chat-input-bar">
                <textarea id="messageInput" rows="1" placeholder="پیغام لکھیں..."></textarea>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('chats')">
            <span class="icon">💬</span>
            <span>چٹس</span>
            <span class="nav-badge" id="totalUnreadBadge">0</span>
        </div>
        <div class="nav-item" onclick="switchTab('people')">
            <span class="icon">👥</span>
            <span>ممبرز / لوگ</span>
        </div>
        <div class="nav-item" onclick="openGroupModal()">
            <span class="icon">➕</span>
            <span>گروپ بنائیں</span>
        </div>
        <div class="nav-item" onclick="switchTab('notifications')">
            <span class="icon">🔔</span>
            <span>نوٹیفیکیشن</span>
        </div>
    </div>

    <script>
        // Firebase Configuration (آپ اپنی فائر بیس کی تفصیلات یہاں درج کریں گے)
        const firebaseConfig = {
            databaseURL: "YOUR_FIREBASE_DATABASE_URL_HERE"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUserId = "user_waqar"; // مثال کے طور پر موجودہ یوزر کی آئی ڈی
        let activeRecipientId = null;

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(tabName === 'chats') {
                // چیٹس ویو
            } else if(tabName === 'people') {
                alert("فالو یا ان فالو کرنے کے لیے ممبرز لسٹ یہاں شو ہوگی۔");
            }
        }

        function startAudioCall() {
            if(!activeRecipientId) { alert("پہلے کوئی چیٹ منتخب کریں!"); return; }
            alert("آڈیو کال ملائی جا रही ہے...");
        }

        function startVideoCall() {
            if(!activeRecipientId) { alert("پہلے کوئی چیٹ منتخب کریں!"); return; }
            alert("ویڈیو کال شروع کی جا رہی ہے...");
        }

        function openGroupModal() {
            let groupName = prompt("نئے گروپ کا نام درج کریں (لامحدود ممبرز کے ساتھ):");
            if(groupName) {
                alert("گروپ '" + groupName + "' کامیابی سے بن گیا ہے!");
            }
        }

        function sendMessage() {
            let input = document.getElementById('messageInput');
            let text = input.value.trim();
            if(!text || !activeRecipientId) return;

            let msgData = {
                sender: currentUserId,
                receiver: activeRecipientId,
                message: text,
                timestamp: Date.now()
            };

            db.ref('messages/' + getChatRoomId(currentUserId, activeRecipientId)).push(msgData);
            input.value = '';
        }

        function getChatRoomId(id1, id2) {
            return id1 < id2 ? id1 + "_" + id2 : id2 + "_" + id1;
        }

        // سکرین اور ڈیٹا لوڈنگ کا عمل جاری رہے گا...
    </script>
</body>
</html>
