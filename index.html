<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازار - لائیو سرور ایپ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #0f172a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 5px 0 0 0; font-size: 0.85rem; color: #38bdf8; }
        
        .content { padding: 20px; flex: 1; }
        
        /* سرور سٹیٹس بار */
        #server-status {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
        }

        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .product-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>بازار ایپ</h1>
            <p>RAILWAY BACKEND CONNECTED APP</p>
        </header>

        <div class="content">
            <!-- سرور کنکشن کی لائیو حالت -->
            <div id="server-status">ریلوے سرور سے رابطہ کیا جا رہا ہے...</div>

            <div class="card">
                <strong>📦 نئی پروڈکٹ سرور پر بھیجیں</strong>
                <input type="text" id="p-name" placeholder="پروڈکٹ کا نام">
                <input type="number" id="p-price" placeholder="قیمت (روپے)">
                <button class="btn-primary" onclick="sendDataToServer()">سرور پر محفوظ کریں</button>
            </div>

            <div style="font-weight: bold; margin-top: 20px; margin-bottom: 10px;">🛒 ریلوے سرور کا ڈیٹا:</div>
            <div id="server-data-list">
                <div class="product-item"><span>سرور سے ڈیٹا کا انتظار ہے...</span></div>
            </div>
        </div>
    </div>

    <script>
        const backendUrl = "https://beneficial-gentleness-production.up.railway.app";

        // صفحہ کھلتے ہی ریلوے سرور سے رابطہ چیک کرنا اور ڈیٹا لانا
        async function checkAndFetchServer() {
            const statusBox = document.getElementById('server-status');
            const dataList = document.getElementById('server-data-list');

            try {
                statusBox.innerText = "سرور سے رابطہ ہو رہا ہے...";
                
                // ریلوے سرور کو ریکوئسٹ بھیجنا
                const response = await fetch(backendUrl, {
                    method: 'GET',
                    mode: 'cors' // یہاں ہم کورس موڈ استعمال کر رہے ہیں
                });

                if (response.ok) {
                    statusBox.style.backgroundColor = "#ecfdf5";
                    statusBox.style.color = "#059669";
                    statusBox.style.borderColor = "#a7f3d0";
                    statusBox.innerText = "✓ ریلوے سرور سے کامیابی سے جڑ گیا ہے!";
                    
                    // اگر سرور سے کوئی ڈیٹا آیا تو اسے شو کریں گے
                    dataList.innerHTML = `<div class="product-item"><span>سرور آن لائن ہے لیکن کوئی پروڈکٹ نہیں ملی۔</span></div>`;
                } else {
                    throw new Error("سرور کا جواب ٹھیک نہیں ہے");
                }
            } catch (error) {
                statusBox.style.backgroundColor = "#fee2e2";
                statusBox.style.color = "#dc2626";
                statusBox.style.borderColor = "#fecaca";
                statusBox.innerText = "⚠ سرور تک رسائی میں رکاوٹ (CORS یا نیٹ ورک مسئلہ)";
                dataList.innerHTML = `<div class="product-item" style="color: #dc2626;"><span>رابطہ فیل ہو گیا: ${error.message}</span></div>`;
            }
        }

        // جب آپ سرور پر ڈیٹا بھیجنا چاہیں
        async function sendDataToServer() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;

            if(!name || !price) {
                alert("براہ کرم نام اور قیمت دونوں لکھیں!");
                return;
            }

            try {
                alert("سرور پر ڈیٹا بھیجنے کی کوشش کی جا रही है...");
                // یہاں ہم پوسٹ ریکوئسٹ بھیجیں گے
                const response = await fetch(backendUrl + "/add-product", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, price })
                });

                if(response.ok) {
                    alert("ڈیٹا کامیابی سے ریلوے سرور پر محفوظ ہو گیا!");
                } else {
                    alert("سرور نے ڈیٹا محفوظ کرنے سے انکار کر دیا (Endpoint موجود نہیں ہو سکتا)۔");
                }
            } catch (e) {
                alert("سرور سے ڈیٹا نہیں جڑ سکا: " + e.message);
            }
        }

        window.onload = checkAndFetchServer;
    </script>
</body>
</html>
