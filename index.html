<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازار - کنکشن ٹیسٹر</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { font-size: 1.8rem; color: #1a252c; text-align: center; }
        .log-box {
            background: #1e293b;
            color: #38bdf8;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            height: 150px;
            overflow-y: auto;
            margin: 15px 0;
            text-align: left;
            direction: ltr;
        }
        .btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بازار - سرور کنکشن چیک</h1>
        <p style="text-align: center; color: #666;">گٹ ہب اور ریلوے سرور کے درمیان لائیو رابطہ ٹیسٹ کیا جا رہا ہے...</p>
        
        <!-- یہاں لائیو لاگ نظر آئیں گے کہ کیا خرابی ہے -->
        <div id="log" class="log-box">سسٹم شروع ہو رہا ہے...</div>

        <button class="btn" onclick="testConnectionNow()">دوبارہ کنکشن ٹیسٹ کریں</button>
    </div>

    <script>
        const backendUrl = "https://beneficial-gentleness-production.up.railway.app";

        function logMessage(msg) {
            const box = document.getElementById('log');
            box.innerHTML += `<br>> ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        async function testConnectionNow() {
            logMessage("رابطے کی کوشش کی جا रही है...");
            logMessage(`يو آر ایل: ${backendUrl}`);

            try {
                // یہاں ہم گیٹ ریکوئسٹ بھیج رہے ہیں
                const response = await fetch(backendUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                logMessage(`رسپانس مل گیا! سٹیٹس: ${response.status}`);
                if (response.ok) {
                    logMessage(" کامیابی! سرور بالکل ٹھیک جواب دے رہا ہے!");
                } else {
                    logMessage("⚠ سرور تک رسائی ہوئی لیکن کوئی مسئلہ ہے۔");
                }

            } catch (error) {
                logMessage(`❌ خرابی (Error): ${error.message}`);
                logMessage("وجہ: ہو سکتا ہے CORS پالیسی یا غلط اینڈ پوائنٹ کا مسئلہ ہو۔");
            }
        }

        // صفحہ کھلتے ہی خود بخود ٹیسٹ شروع ہو جائے گا
        window.onload = () => {
            testConnectionNow();
        };
    </script>
</body>
</html>
