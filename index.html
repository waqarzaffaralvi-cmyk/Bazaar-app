<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازار - Bazaar App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #333;
            padding-top: 30px;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5rem;
            color: #1a252c;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #4a5568;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        /* اصل بازار ایپ کا مین انٹرفیس جو اب سکرین پر براہِ راست نظر آئے گا */
        #main-app {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            width: 100%;
            box-sizing: border-box;
            text-align: right;
        }
        .app-header {
            font-size: 1.4rem;
            color: #059669;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .app-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #e9ecef;
        }
        .shop-btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .shop-btn:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ایپ کا نام -->
        <h1>بازار</h1>
        <div class="subtitle">Bazaar App</div>

        <!-- سیدھا اصل بازار ایپ کا ڈیش بورڈ (بغیر کسی انتظار یا چیکنگ بار کے) -->
        <div id="main-app">
            <div class="app-header">خوش آمدید - بازار ڈیش بورڈ</div>
            <div class="app-item">
                <strong>📦 آپ کا آن لائن سٹور</strong>
                <p style="margin: 5px 0 0 0; color: #666; font-size: 0.9rem;">آپ کا سسٹم تیار ہے، یہاں سے آپ اپنی ایپ کی ٹیسٹنگ شروع کر سکتے ہیں۔</p>
            </div>
            <div class="app-item">
                <strong>🛒 مصنوعات کا انتظام</strong>
                <p style="margin: 5px 0 0 0; color: #666; font-size: 0.9rem;">تمام فیچرز اب آپ کے سامنے سکرین پر موجود ہیں۔</p>
            </div>
            <button class="shop-btn" onclick="alert('بازار ایپ میں خوش آمدید!')">کام شروع کریں</button>
        </div>
    </div>

</body>
</html>
