<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازار - Bazaar App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        /* ایپ کا ہیڈر بار */
        header {
            background-color: #0f172a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }
        /* اصل باڈی سیکشن */
        .content {
            padding: 20px;
            flex: 1;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #334155;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }
        /* پروڈکٹ کارڈ / ڈیش بورڈ خاکہ */
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card input, .card select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .btn-primary {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:active {
            background-color: #047857;
        }
        /* پروڈکٹ لسٹ شو کرنے کی جگہ */
        #product-list {
            margin-top: 15px;
        }
        .product-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ایپ ہیڈر -->
        <header>
            <h1>بازار ایپ</h1>
            <p>BAZAAR LIVE TESTING DASHBOARD</p>
        </header>

        <!-- مین ورکنگ انٹرفیس -->
        <div class="content">
            
            <!-- نئی پروڈکٹ ایڈ کرنے کا پینل -->
            <div class="section-title">📦 نئی پروڈکٹ شامل کریں</div>
            <div class="card">
                <label style="font-size: 0.9rem; font-weight: bold;">پروڈکٹ کا نام:</label>
                <input type="text" id="p-name" placeholder="مثلاً: چادر، تکیہ کور، وغیرہ">
                
                <label style="font-size: 0.9rem; font-weight: bold;">قیمت (روپے):</label>
                <input type="number" id="p-price" placeholder="مثلاً: 1500">

                <button class="btn-primary" onclick="addProduct()">فہرست میں جوڑیں</button>
            </div>

            <!-- موجودہ اشیاء کی لسٹ -->
            <div class="section-title" style="margin-top: 25px;">🛒 بازار کی اشیاء (لائیو ٹیسٹ)</div>
            <div id="product-list">
                <div class="product-item">
                    <span>ڈیزائن بیڈ شیٹ (نمونہ)</span>
                    <strong style="color: #059669;">Rs. 2,500</strong>
                </div>
            </div>

        </div>
    </div>

    <script>
        // یہاں آپ لائیو ٹیسٹنگ کے لیے آئٹمز ایڈ کر سکتے ہیں
        function addProduct() {
            const nameInput = document.getElementById('p-name');
            const priceInput = document.getElementById('p-price');
            const listContainer = document.getElementById('product-list');

            if(nameInput.value.trim() === "" || priceInput.value.trim() === "") {
                alert("براہ کرم نام اور قیمت دونوں درج کریں!");
                return;
            }

            // نیا آئٹम سکرین پر دکھانا
            const newItem = document.createElement('div');
            newItem.className = 'product-item';
            newItem.innerHTML = `<span>${nameInput.value}</span><strong style="color: #059669;">Rs. ${priceInput.value}</strong>`;
            
            listContainer.prepend(newItem);

            // خانوں کو خالی کرنا
            nameInput.value = "";
            priceInput.value = "";
            
            alert("پروڈکٹ کامیابی سے شامل ہو گئی!");
        }
    </script>
</body>
</html>
