
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9 Bazaar - پروفائل اور مارکیٹ</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#f4f6f9;color:#333;display:flex;flex-direction:column;min-height:100vh;padding-bottom:70px}
.header{background:#1e4620;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ffc107;position:sticky;top:0;z-index:1001}
.header h2{font-size:14px}
.badge-server{background:#f0ad4e;color:#fff;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:bold}
.badge-money{background:#ffc107;color:#000;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:bold}
.section-container{padding:15px;width:100%;max-width:600px;margin:0 auto}
.app-section{display:none}
.app-section.active-section{display:block}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 3px 8px rgba(0,0,0,.06);border-right:4px solid #1e4620}
.card h3{margin-bottom:10px;color:#1e4620;font-size:15px;display:flex;justify-content:space-between;align-items:center}
input,textarea,select{width:100%;padding:10px;margin-top:4px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;font-size:14px;background:#fff}
input:disabled,textarea:disabled{background:#e9ecef;color:#495057;border-color:#ced4da;font-weight:bold}
label{font-size:13px;font-weight:bold;color:#444;display:block;margin-top:4px}
.profile-dp-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #1e4620;display:block;margin:0 auto 12px;background:#ddd;box-shadow:0 3px 6px rgba(0,0,0,.15)}
.btn{border:none;padding:10px 15px;border-radius:25px;cursor:pointer;font-size:14px;width:100%;font-weight:bold;margin-top:8px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.btn-green{background:#5cb85c;color:#fff}
.btn-darkgreen{background:#1e4620;color:#fff}
.btn-orange{background:#f0ad4e;color:#fff}
.btn-red{background:#d9534f;color:#fff;margin-top:15px}
.success-box{background:#dff0d8;color:#3c763d;padding:10px;border-radius:8px;margin-top:10px;font-size:13px;border-right:4px solid #5cb85c;display:none;line-height:1.5}
.lock-badge{background:#d9534f;color:#fff;padding:3px 8px;border-radius:12px;font-size:10px}
.unlock-badge{background:#5cb85c;color:#fff;padding:3px 8px;border-radius:12px;font-size:10px}
.members-scroll-box{max-height:70vh;overflow-y:auto;padding-right:4px}
.member-item{display:flex;align-items:center;background:#fafafa;border:1px solid #e0e0e0;border-radius:8px;padding:10px;margin-bottom:8px;position:relative}
.member-dp{width:45px;height:45px;border-radius:50%;background:#1e4620;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;margin-left:12px;flex-shrink:0;overflow:hidden}
.member-dp img{width:100%;height:100%;object-fit:cover}
.member-info{flex-grow:1;text-align:right}
.member-name{font-size:14px;font-weight:bold;color:#333}
.member-role{font-size:11px;color:#666;margin-top:2px}
.status-dot{width:12px;height:12px;border-radius:50%;display:inline-block;position:absolute;top:12px;left:12px;border:2px solid #fff}
.dot-online{background:#27ae60}
.dot-offline{background:#999}
.chat-btn{width:auto;padding:5px 12px;font-size:12px;margin:0 0 0 24px}
.product-card{background:#fdfdfd;border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:12px}
.product-card img,.product-card video{width:100%;max-height:200px;object-fit:cover;border-radius:6px;margin-top:5px}
.condition-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:bold;margin-bottom:5px}
.badge-new{background:#5cb85c;color:#fff}
.badge-used{background:#f0ad4e;color:#fff}
.chat-line{padding:6px 10px;border-radius:6px;margin-bottom:6px;border-right:3px solid #5cb85c;background:#e2f0d9}
.chat-line.other{background:#e8eefc;border-right-color:#4a7be0}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:6px 0;z-index:1000;height:60px;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
.nav-item{text-align:center;color:#666;font-size:10px;flex:1;cursor:pointer;background:none;border:none;font-weight:600}
.nav-item.active{color:#1e4620;font-weight:bold}
.nav-item .icon-circle{display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:0 auto 2px;border-radius:50%;background:#f0f2f5;font-size:13px;transition:.2s}
.nav-item.active .icon-circle{background:#1e4620;color:#fff}
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="badge-money">5,000 $</span>
    <span class="badge-server" id="serverStatusBadge">⏳ کنیکٹنگ...</span>
  </div>
  <h2 id="pageTitle">🔒 پروفائل و لاگ ان</h2>
</div>

<div class="section-container">

  <!-- 1: لاگ ان / پروفائل -->
  <div id="section-0" class="app-section active-section">
    <div class="card">
      <h3><span>صارف کی پروفائل اور ڈی پی</span><span id="lockStatusBadge" class="unlock-badge">فتح (Editable)</span></h3>
      <img id="dpPreviewImg" src="" class="profile-dp-preview" alt="DP" style="display:none;">
      <label>📷 پروفائل تصویر (DP) منتخب کریں:</label>
      <input type="file" id="userDpFile" accept="image/*" onchange="previewAndCompressDp(event)">
      <label>👤 پورا نام:</label>
      <input type="text" id="userNameInput" placeholder="پورا نام لکھیں">
      <label>📧 ای میل:</label>
      <input type="email" id="userEmailInput" placeholder="example@gmail.com">
      <label>📞 فون نمبر:</label>
      <input type="text" id="userPhoneInput" placeholder="فون نمبر">
      <label>📝 کاروبار کی تفصیل:</label>
      <textarea id="userRoleInput" placeholder="مثلاً: دکاندار، خریدار..."></textarea>
      <button id="lockBtn" class="btn btn-green" onclick="saveAndLock()">🔒 ڈیٹا لاک اور محفوظ کریں</button>
      <button id="unlockBtn" class="btn btn-orange" style="display:none;" onclick="unlockPage()">🔓 ڈیٹا ان لاک کریں</button>
      <div id="authStatusBox" class="success-box"><strong>🔒 ڈیٹا محفوظ ہو چکا ہے:</strong><br><span id="displaySavedInfo"></span></div>
      <button class="btn btn-red" onclick="clearData()">اکاؤنٹ ری سیٹ کریں</button>
    </div>
  </div>

  <!-- 2: مارکیٹ -->
  <div id="section-1" class="app-section">
    <div class="card">
      <h3>🛒 بازار اور پروڈکٹ شیئرنگ</h3>
      <label>📦 پروڈکٹ/آئٹم کا نام:</label>
      <input type="text" id="prodTitle" placeholder="مثلاً: بیڈ شیٹ، برانڈڈ کوئٹ کور...">
      <label>🏷️ حالت (Condition):</label>
      <select id="prodCondition">
        <option value="new">✨ بالکل نئی (Brand New)</option>
        <option value="used">♻️ استعمال شدہ (Used)</option>
      </select>
      <label>📷 تصویر یا ویڈیو منتخب کریں:</label>
      <input type="file" id="prodMediaFile" accept="image/*,video/*">
      <label>📝 تفصیل (Description):</label>
      <textarea id="prodDesc" placeholder="آئٹم کی تفصیل، قیمت یا استعمال کے بارے میں لکھیں..."></textarea>
      <button class="btn btn-darkgreen" onclick="uploadProduct()">🚀 مارکیٹ میں پوسٹ کریں</button>
    </div>
    <div class="card">
      <h3>🛍️ مارکیٹ کی تمام مصنوعات</h3>
      <div id="marketFeedContainer" style="max-height:60vh;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- 3: ممبرز -->
  <div id="section-2" class="app-section">
    <div class="card" style="padding:10px;">
      <h3>👥 ممبرز کی فہرست (لائیو)</h3>
      <div class="members-scroll-box" id="membersListContainer"></div>
    </div>
  </div>

  <!-- 4: پولنگ -->
  <div id="section-3" class="app-section">
    <div class="card">
      <h3>📊 الیکشن پول اور ووٹنگ</h3>
      <p style="font-size:13px;color:#666;margin-bottom:10px;">رائے شماری اور پولنگ کا نظام۔</p>
    </div>
  </div>

  <!-- 5: چیٹ -->
  <div id="section-4" class="app-section">
    <div class="card">
      <h3>💬 لائیو چیٹ</h3>
      <label>👤 کس کو بھیجنا ہے:</label>
      <select id="chatTarget"><option value="">👥 سب کو (کمیونٹی)</option></select>
      <label>💬 پیغام درج کریں:</label>
      <input type="text" id="chatInputMsg" placeholder="یہاں پیغام لکھیں...">
      <button class="btn btn-darkgreen" onclick="sendChatMessage()">📤 پیغام بھیجیں</button>
      <label style="margin-top:10px;">📜 پیغامات:</label>
      <div style="background:#f9f9f9;border:1px solid #ddd;border-radius:8px;height:220px;overflow-y:auto;padding:8px;font-size:13px;text-align:right;" id="chatHistoryBox">
        <div class="chat-line"><b>سسٹم:</b> خوش آمدید!</div>
      </div>
    </div>
  </div>

</div>

<div class="bottom-nav">
  <button class="nav-item active" onclick="switchSection(0,'🔒 پروفائل و لاگ ان')"><div class="icon-circle">🔒</div>لاگ ان</button>
  <button class="nav-item" onclick="switchSection(1,'🛒 مارکیٹ')"><div class="icon-circle">🛒</div>مارکیٹ</button>
  <button class="nav-item" onclick="switchSection(2,'👥 ممبرز')"><div class="icon-circle">👥</div>ممبرز</button>
  <button class="nav-item" onclick="switchSection(3,'📊 پولنگ')"><div class="icon-circle">📊</div>پولنگ</button>
  <button class="nav-item" onclick="switchSection(4,'💬 چیٹ')"><div class="icon-circle">💬</div>چیٹ</button>
</div>

<script>
const SOCKET_URL = "https://bazaar-app-production-c614.up.railway.app";
const socket = io(SOCKET_URL, { transports: ['websocket', 'polling'] });
const statusBadge = document.getElementById('serverStatusBadge');
let serverMembers = [];

// نقصان دہ حروف سے بچاؤ (دوسروں کا لکھا ہوا متن محفوظ دکھانے کے لیے)
function esc(t) {
  return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function myName() { return localStorage.getItem('iron_name') || ''; }

// خود کو سرور پر رجسٹر کرنا
function registerOnServer() {
  const name = myName();
  if (!name || !socket.connected) return;
  socket.emit('register_user', {
    name: name,
    role: localStorage.getItem('iron_role') || '',
    dp: localStorage.getItem('iron_dp') || ''
  });
}

socket.on('connect', () => {
  statusBadge.innerText = "🟢 لائیو جڑا ہوا ہے";
  statusBadge.style.background = "#5cb85c";
  registerOnServer();
});
socket.on('disconnect', () => {
  statusBadge.innerText = "⚠️ آف لائن";
  statusBadge.style.background = "#dc3545";
});

// سرور سے ممبرز کی تازہ فہرست
socket.on('update_members', (list) => {
  serverMembers = Array.isArray(list) ? list : [];
  loadMembersList();
  refreshChatTargets();
});

// دوسرے یوزر کا پیغام
socket.on('receive_chat_message', (d) => {
  if (!d) return;
  addChatLine(esc(d.from || 'نامعلوم') + (d.to ? ' (نجی)' : '') + ' [' + esc(d.time || '') + ']', d.text, false);
});

function switchSection(index, titleText) {
  document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active-section'));
  document.getElementById('section-' + index).classList.add('active-section');
  document.getElementById('pageTitle').innerText = titleText;
  document.querySelectorAll('.nav-item').forEach((item, idx) => {
    item.classList.toggle('active', idx === index);
  });
  if (index === 2) loadMembersList();
  if (index === 1) loadMarketFeed();
}

window.onload = function () {
  const savedName = localStorage.getItem('iron_name') || '';
  const savedEmail = localStorage.getItem('iron_email') || '';
  const savedPhone = localStorage.getItem('iron_phone') || '';
  const savedRole = localStorage.getItem('iron_role') || '';
  const savedDp = localStorage.getItem('iron_dp');
  const isLocked = localStorage.getItem('iron_is_locked') === 'true';

  document.getElementById('userNameInput').value = savedName;
  document.getElementById('userEmailInput').value = savedEmail;
  document.getElementById('userPhoneInput').value = savedPhone;
  document.getElementById('userRoleInput').value = savedRole;

  if (savedDp) {
    const preview = document.getElementById('dpPreviewImg');
    preview.src = savedDp;
    preview.style.display = 'block';
  }
  if (isLocked && savedName) applyLockState(savedName, savedEmail, savedPhone, savedRole, savedDp);

  loadMembersList();
  loadMarketFeed();
  registerOnServer();
};

function previewAndCompressDp(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const img = new Image();
    img.onload = function () {
      const canvas = document.createElement('canvas');
      const MAX = 200;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
      else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL('image/jpeg', 0.8);
      localStorage.setItem('iron_dp_temp', data);
      const preview = document.getElementById('dpPreviewImg');
      preview.src = data;
      preview.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveAndLock() {
  const name = document.getElementById('userNameInput').value.trim();
  const email = document.getElementById('userEmailInput').value.trim();
  const phone = document.getElementById('userPhoneInput').value.trim();
  const role = document.getElementById('userRoleInput').value.trim();
  const finalDp = localStorage.getItem('iron_dp_temp') || localStorage.getItem('iron_dp') || '';

  if (!name || !email) {
    alert('براہ کرم نام اور ای میل درج کریں!');
    return;
  }
  finishSavingAndLock(name, email, phone, role, finalDp);
}

function finishSavingAndLock(name, email, phone, role, dpData) {
  localStorage.setItem('iron_name', name);
  localStorage.setItem('iron_email', email);
  localStorage.setItem('iron_phone', phone);
  localStorage.setItem('iron_role', role);
  localStorage.setItem('iron_is_locked', 'true');
  if (dpData) {
    localStorage.setItem('iron_dp', dpData);
    const preview = document.getElementById('dpPreviewImg');
    preview.src = dpData;
    preview.style.display = 'block';
  }
  applyLockState(name, email, phone, role, dpData);
  registerOnServer();
  alert('پروفائل کامیابی سے محفوظ ہو گئی اور سرور پر رجسٹر ہو گئی! 🌐🔒');
}

// ممبرز کی لائیو فہرست
function loadMembersList() {
  const container = document.getElementById('membersListContainer');
  if (!serverMembers.length) {
    container.innerHTML = '<p style="font-size:13px;color:#777;text-align:center;padding:10px;">ابھی کوئی ممبر آن لائن نہیں۔ پہلے پروفائل محفوظ کریں۔</p>';
    return;
  }
  const me = myName();
  let html = '';
  serverMembers.forEach(m => {
    const dpHtml = m.dp ? `<img src="${esc(m.dp)}" alt="DP">` : esc((m.name || '').substring(0, 2).toUpperCase());
    const dot = m.online ? 'dot-online' : 'dot-offline';
    const chatBtn = (m.name !== me && m.online)
      ? `<button class="btn btn-darkgreen chat-btn" onclick="openChatWith('${esc(m.id)}')">💬 چیٹ</button>` : '';
    html += `
      <div class="member-item">
        <span class="status-dot ${dot}"></span>
        <div class="member-dp">${dpHtml}</div>
        <div class="member-info">
          <div class="member-name">${esc(m.name)}${m.name === me ? ' (آپ)' : ''}</div>
          <div class="member-role">${esc(m.role) || 'ممبر'}</div>
        </div>
        ${chatBtn}
      </div>`;
  });
  container.innerHTML = html;
}

// چیٹ کے لیے وصول کنندہ کی فہرست
function refreshChatTargets() {
  const sel = document.getElementById('chatTarget');
  const current = sel.value;
  const me = myName();
  let html = '<option value="">👥 سب کو (کمیونٹی)</option>';
  serverMembers.forEach(m => {
    if (m.online && m.name !== me) html += `<option value="${esc(m.id)}">${esc(m.name)}</option>`;
  });
  sel.innerHTML = html;
  if ([...sel.options].some(o => o.value === current)) sel.value = current;
}

function openChatWith(id) {
  switchSection(4, '💬 چیٹ');
  refreshChatTargets();
  document.getElementById('chatTarget').value = id;
}

function addChatLine(who, text, mine) {
  const box = document.getElementById('chatHistoryBox');
  const div = document.createElement('div');
  div.className = 'chat-line' + (mine ? '' : ' other');
  div.innerHTML = '<b>' + who + ':</b> ' + esc(text);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendChatMessage() {
  const input = document.getElementById('chatInputMsg');
  const text = input.value.trim();
  if (!text) return;
  const name = myName();
  if (!name) { alert('پہلے پروفائل محفوظ کریں!'); return; }
  if (!socket.connected) { alert('سرور سے رابطہ نہیں ہے، تھوڑی دیر بعد کوشش کریں۔'); return; }

  const sel = document.getElementById('chatTarget');
  const to = sel.value;
  const toName = to ? sel.options[sel.selectedIndex].text : 'سب';
  const time = new Date().toLocaleTimeString();

  socket.emit('send_chat_message', { to: to || undefined, from: name, text: text, time: time });
  addChatLine('آپ ← ' + esc(toName) + ' [' + time + ']', text, true);
  input.value = '';
}

// مارکیٹ (فی الحال صرف اسی فون میں محفوظ ہوتی ہے)
function uploadProduct() {
  const title = document.getElementById('prodTitle').value.trim();
  const condition = document.getElementById('prodCondition').value;
  const desc = document.getElementById('prodDesc').value.trim();
  const fileInput = document.getElementById('prodMediaFile');
  if (!title) { alert('براہ کرم پروڈکٹ کا نام درج کریں!'); return; }
  const author = myName() || 'مہمان';

  if (fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = e => saveProductToStorage(title, condition, desc, e.target.result, fileInput.files[0].type, author);
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    saveProductToStorage(title, condition, desc, '', '', author);
  }
}

function saveProductToStorage(title, condition, desc, mediaData, mediaType, author) {
  let products = JSON.parse(localStorage.getItem('bazaar_market_products')) || [];
  products.unshift({ title, condition, desc, mediaData, mediaType, author, date: new Date().toLocaleDateString() });
  try {
    localStorage.setItem('bazaar_market_products', JSON.stringify(products));
  } catch (e) {
    alert('جگہ ختم ہو گئی، چھوٹی تصویر یا ویڈیو کے بغیر کوشش کریں۔');
    return;
  }
  document.getElementById('prodTitle').value = '';
  document.getElementById('prodDesc').value = '';
  document.getElementById('prodMediaFile').value = '';
  loadMarketFeed();
  alert('پروڈکٹ کامیابی سے مارکیٹ میں پوسٹ ہو گئی ہے!');
}

function loadMarketFeed() {
  const container = document.getElementById('marketFeedContainer');
  const products = JSON.parse(localStorage.getItem('bazaar_market_products')) || [];
  if (!products.length) {
    container.innerHTML = '<p style="font-size:13px;color:#777;text-align:center;padding:10px;">ابھی تک کوئی پروڈکٹ شیئر نہیں کی گئی۔</p>';
    return;
  }
  let html = '';
  products.forEach(p => {
    const badgeClass = p.condition === 'new' ? 'badge-new' : 'badge-used';
    const condText = p.condition === 'new' ? '✨ بالکل نئی (Brand New)' : '♻️ استعمال شدہ (Used)';
    let media = '';
    if (p.mediaData) {
      media = (p.mediaType && p.mediaType.includes('video'))
        ? `<video controls src="${p.mediaData}"></video>` : `<img src="${p.mediaData}" alt="Product">`;
    }
    html += `
      <div class="product-card">
        <span class="condition-badge ${badgeClass}">${condText}</span>
        <h4 style="font-size:14px;color:#1e4620;margin-bottom:4px;">${esc(p.title)}</h4>
        <p style="font-size:12px;color:#555;margin-bottom:6px;">${esc(p.desc) || 'تفصیل موجود نہیں'}</p>
        ${media}
        <div style="font-size:10px;color:#888;margin-top:6px;display:flex;justify-content:space-between;">
          <span>بیچنے والا: <b>${esc(p.author)}</b></span><span>تاریخ: ${esc(p.date)}</span>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

function applyLockState(name, email, phone, role, dp) {
  ['userNameInput', 'userEmailInput', 'userPhoneInput', 'userRoleInput'].forEach(id => {
    document.getElementById(id).disabled = true;
  });
  document.getElementById('lockBtn').style.display = 'none';
  document.getElementById('unlockBtn').style.display = 'block';
  const badge = document.getElementById('lockStatusBadge');
  badge.innerText = "آہنی لاک (Locked)";
  badge.className = "lock-badge";
  document.getElementById('displaySavedInfo').innerHTML =
    `نام: <b>${esc(name)}</b><br>ای میل: <b>${esc(email)}</b><br>فون: <b>${esc(phone) || 'درج نہیں'}</b><br>تفصیل: ${esc(role)}`;
  document.getElementById('authStatusBox').style.display = 'block';
}

function unlockPage() {
  ['userNameInput', 'userEmailInput', 'userPhoneInput', 'userRoleInput'].forEach(id => {
    document.getElementById(id).disabled = false;
  });
  document.getElementById('lockBtn').style.display = 'block';
  document.getElementById('unlockBtn').style.display = 'none';
  const badge = document.getElementById('lockStatusBadge');
  badge.innerText = "فتح (Editable)";
  badge.className = "unlock-badge";
  document.getElementById('authStatusBox').style.display = 'none';
  localStorage.setItem('iron_is_locked', 'false');
  alert('ڈیٹا ان لاک ہو گیا ہے!');
}

function clearData() {
  if (confirm('کیا آپ سارا ڈیٹا صاف کرنا چاہتے ہیں؟')) {
    localStorage.clear();
    location.reload();
  }
}
</script>
