<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازار - اصل ایپ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        /* ویلکم سکرین جو پہلے سامنے آئے گی */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen h2 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #38bdf8;
        }
        #splash-screen p {
            margin: 0;
            font-size: 1.1rem;
            color: #94a3b8;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* اصل ایپ کا ڈیزائن */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #0f172a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 5px 0 0 0; font-size: 0.85rem; color: #38bdf8; }
        
        .content { padding: 20px; flex: 1; }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .product-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- یہ وہ سکرین ہے جو سرچ کرنے والے کو تسلی دلائے گی کہ وہ صحیح ایپ پر آ گیا ہے -->
    <div id="splash-screen">
        <h2>بازار ایپ</h2>
        <p>مبارک ہو! آپ بالکل درست اور اصل ایپ پر آ گئے ہیں...</p>
        <div class="spinner"></div>
    </div>

    <!-- اصل بازار ایپ جو ویلکم سکرین ہٹنے کے بعد فورا سامنے آ جائے گی -->
    <div class="app-container">
        <header>
            <h1>بازار ڈیش بورڈ</h1>
            <p>BAZAAR LIVE OPERATIONAL APP</p>
        </header>

        <div class="content">
            <div class="card">
                <strong>📦 نئی پروڈکٹ شامل کریں</strong>
                <input type="text" id="p-name" placeholder="پروڈکٹ کا نام (مثلاً بیڈ شیٹ)">
                <input type="number" id="p-price" placeholder="قیمت (روپے)">
                <button class="btn-primary" onclick="addAppProduct()">فہرست میں درج کریں</button>
            </div>

            <div style="font-weight: bold; margin-top: 20px; margin-bottom: 10px;">🛒 بازار کی فعال اشیاء:</div>
            <div id="app-product-list">
                <div class="product-item">
                    <span>خوبصورت ڈیزائن بیڈ شیٹ</span>
                    <strong style="color: #059669;">Rs. 2,500</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        // جیسے ہی پیج لوڈ ہوگا، ویلکم سکرین ڈیڑھ سیکنڈ (1.5s) بعد خود بخود غائب ہو جائے گی
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 1500); // 1.5 سیکنڈ کا وقفہ تاکہ تسلی ہو جائے
        });

        // ایپ میں پروڈکٹ ایڈ کرنے کا فنکشن (جو لوکل یا سرور ڈیٹا کو ہینڈل کرے گا)
        function addAppProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const list = document.getElementById('app-product-list');

            if(!name || !price) {
                alert("براہ کرم پروڈکٹ کا نام اور قیمت دونوں درج کریں!");
                return;
            }

            const item = document.createElement('div');
            item.className = 'product-item';
            item.innerHTML = `<span>${name}</span><strong style="color: #059669;">Rs. ${price}</strong>`;
            
            list.prepend(item);

            document.getElementById('p-name').value = "";
            document.getElementById('p-price').value = "";
            
            alert("پروڈکٹ کامیابی سے بازار ایپ میں شامل کر دی گئی ہے!");
        }
    </script>
</body>
</html>
